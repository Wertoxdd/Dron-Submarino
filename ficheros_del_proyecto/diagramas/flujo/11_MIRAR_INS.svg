<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" font-size="12.5" version="1.1" width="760px" height="680px"><title>MIRAR_INS clasifica la siguiente instrucción sin mover PUNTERO</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">MIRAR_INS clasifica la siguiente instrucción sin mover PUNTERO</text><g><g id="m-start"><rect x="125" y="63" width="150" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MIRAR_INS</text></g><g id="flecha-01"><path d="M200 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,110.25 200,117.75 196.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="d-fin"><polygon points="105,146 200,118 295,146 200,174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="150" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PUNTERO &gt; 7FH?</text></g><g id="flecha-02"><path d="M295 146H379" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="372.25,142.25 379.75,146 372.25,149.75" fill="#8A8A8A" stroke="none"/></g><text x="337" y="138" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">sí</text><g id="o-fin"><rect x="380" y="130" width="200" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="480" y="150" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">A = 2 (fin de memoria)</text></g><text x="192" y="190" text-anchor="end" font-size="11.5" fill="#5C5C5C" font-family="Arial">no</text><g id="flecha-03"><path d="M200 174V197" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,190.25 200,197.75 196.25,190.25" fill="#8A8A8A" stroke="none"/></g><g id="b-alto"><rect x="50" y="198" width="300" height="34" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="21