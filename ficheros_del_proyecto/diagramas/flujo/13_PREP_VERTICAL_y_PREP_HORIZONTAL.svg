<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" font-size="12.5" version="1.1" width="760px" height="620px"><title>PREP_VERTICAL y PREP_HORIZONTAL escriben todas las salidas de la maniobra</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">PREP_VERTICAL y PREP_HORIZONTAL escriben todas las salidas de la maniobra</text><g><g id="v-start"><rect x="90" y="63" width="220" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PREP_VERTICAL (B = n)</text></g><g id="flecha-01"><path d="M200 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,110.25 200,117.75 196.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="v-obj"><rect x="50" y="118" width="300" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="137" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">OBJETIVO = 67 + 10·n</text><text x="200" y="153" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">MUL AB deja B = 0: guardar n antes</text></g><g id="flecha-02"><path d="M200 164V185" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,178.25 200,185.75 196.25,178.25" fill="#8A8A8A" stroke="none"/></g><g id="v-dec"><polygon points="100,214 200,186 300,214 200,242" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="218" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PROF &lt; OBJETIVO?</text></g><g id="flecha-03"><path d="M100 214V257" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="103.75,250.25 100,257.75 96.25,250.25" fill="#8A8A8A" stroke="none"/></g><text x="92" y="236" text-anchor="end" font-size="11.5" fill="#5C5C5C" font-family="Arial">sí</text><g id="flecha-04"><path d="M300 214V257" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="303.75,250.25 300,257.75 296.25,250.25" fill="#8A8A8A" stroke="none"/></g><text x="308" y="236" text-anchor="start" font-size="11.5" fill="#5C5C5C" font-family="Arial">no</text><g id="v-bajar"><rect x="22" y="258" width="156" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="100" y="278" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">SENTIDO = 0 (bajar)</text></g><g id="v-subir"><rect x="222" y="258" width="156" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="300" y="278" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">SENTIDO = 1 (subir)</text></g><path d="M100 290V310H300V290" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><g id="flecha-05"><path d="M200 310V333" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,326.25 200,333.75 196.25,326.25" fill="#8A8A8A" stroke="none"/></g><g id="v-pwm0"><rect x="50" y="334" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="354" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM0 = B3H (70 %), P1.5 = SENTIDO</text></g><g id="flecha-06"><path d="M200 366V390" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,383.25 200,390.75 196.25,383.25" fill="#8A8A8A" stroke="none"/></g><g id="v-pwm1"><rect x="50" y="391" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="411" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM1 = 00H, P1.7–P1.6 = 00</text></g><g id="flecha-07"><path d="M200 423V447" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,440.25 200,447.75 196.25,440.25" fill="#8A8A8A" stroke="none"/></g><g id="v-fin"><rect x="50" y="448" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="468" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">FIN = 0</text></g><g id="flecha-08"><path d="M200 480V504" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,497.25 200,504.75 196.25,497.25" fill="#8A8A8A" stroke="none"/></g><g id="v-mostrar"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="50" y="505" width="300" height="32" rx="3"/><path d="M58 505V537M342 505V537"/></g><text x="200" y="525" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MOSTRAR (A = 0CH, B = n, C = 1)</text></g><g id="flecha-09"><path d="M200 537V561" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,554.25 200,561.75 196.25,554.25" fill="#8A8A8A" stroke="none"/></g><g id="v-ret"><rect x="164" y="562" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="581" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><g id="h-start"><rect x="435" y="63" width="280" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PREP_HORIZONTAL (A = INS, B = t)</text></g><g id="flecha-10"><path d="M575 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,110.25 575,117.75 571.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="h-acc"><rect x="425" y="118" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="138" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ACCION = A, TIEMPO = B</text></g><g id="flecha-11"><path d="M575 150V174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,167.25 575,174.75 571.25,167.25" fill="#8A8A8A" stroke="none"/></g><g id="h-pwm0"><rect x="425" y="175" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="195" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM0 = 4DH (30 %), P1.5 = 0</text></g><g id="flecha-12"><path d="M575 207V231" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,224.25 575,231.75 571.25,224.25" fill="#8A8A8A" stroke="none"/></g><g id="h-pwm1"><rect x="425" y="232" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="252" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM1 = 80H (50 %)</text></g><g id="flecha-13"><path d="M575 264V288" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,281.25 575,288.75 571.25,281.25" fill="#8A8A8A" stroke="none"/></g><g id="h-p1"><rect x="425" y="289" width="300" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="308" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P1.7–P1.6 según ACCION:</text><text x="575" y="324" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">A → 11 · D → 10 · E → 01</text></g><g id="flecha-14"><path d="M575 335V359" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,352.25 575,359.75 571.25,352.25" fill="#8A8A8A" stroke="none"/></g><g id="h-ticks"><rect x="425" y="360" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="380" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">CONT_TICKS = 100, F_1S = 0</text></g><g id="flecha-15"><path d="M575 392V416" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,409.25 575,416.75 571.25,409.25" fill="#8A8A8A" stroke="none"/></g><g id="h-mostrar"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="425" y="417" width="300" height="32" rx="3"/><path d="M433 417V449M717 417V449"/></g><text x="575" y="437" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MOSTRAR (A = ACCION, B = t, C = 0)</text></g><g id="flecha-16"><path d="M575 449V473" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,466.25 575,473.75 571.25,466.25" fill="#8A8A8A" stroke="none"/></g><g id="h-ret"><rect x="539" y="474" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="493" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><text x="575" y="530" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">CONT_TICKS = 100: el primer segundo es completo</text></g></svg>
