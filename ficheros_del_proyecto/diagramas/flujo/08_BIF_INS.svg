<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 505" font-size="12.5" version="1.1" width="760px" height="505px"><title>BIF_INS es el punto de bifurcación: la siguiente instrucción decide el estado</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">BIF_INS es el ● del diagrama de estados: la siguiente instrucción decide el estado</text><g><g id="b-start"><rect x="310" y="65" width="140" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="380" y="84" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">BIF_INS</text></g><g id="flecha-01"><path d="M380 95V118" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="383.75,111.25 380,118.75 376.25,111.25" fill="#8A8A8A" stroke="none"/></g><g id="c-mirar"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="250" y="119" width="260" height="34" rx="3"/><path d="M258 119V153M502 119V153"/></g><text x="380" y="140" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MIRAR_INS: A = 0, 1 o 2</text></g><g id="flecha-02"><path d="M380 153V177" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="383.75,170.25 380,177.75 376.25,170.25" fill="#8A8A8A" stroke="none"/></g><g id="d-a"><polygon points="305,208 380,178 455,208 380,238" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="380" y="212" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">A = ?</text></g><g id="ramas"><path d="M380 238V262M140 262H620" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><g id="flecha-03"><path d="M140 262V301" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="143.75,294.25 140,301.75 136.25,294.25" fill="#8A8A8A" stroke="none"/></g><g id="flecha-04"><path d="M380 262V301" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="383.75,294.25 380,301.75 376.25,294.25" fill="#8A8A8A" stroke="none"/