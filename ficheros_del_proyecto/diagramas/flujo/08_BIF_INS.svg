xt-anchor="middle" font-family="Arial">baja o sube a n × 2,5 m</text><text x="380" y="482" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">avanza o gira t segundos</text><text x="620" y="482" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">sube a superficie con FIN = 1</text></g></svg>
