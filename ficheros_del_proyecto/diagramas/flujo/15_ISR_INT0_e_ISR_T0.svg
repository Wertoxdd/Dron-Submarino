<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-size="12.5" version="1.1" width="760px" height="390px"><title>Las dos interrupciones solo levantan flags y vuelven con RETI</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">Las dos interrupciones solo levantan flags y vuelven con RETI</text><g><g id="i0-start"><rect x="90" y="63" width="220" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ISR_INT0 (vector 0003H)</text></g><g id="flecha-01"><path d="M200 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,110.25 200,117.75 196.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="i0-flag"><rect x="60" y="118" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="138" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">F_BOTON = 1</text></g><g id="flecha-02"><path d="M200 150V174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,167.25 200,174.75 196.25,167.25" fill="#8A8A8A" stroke="none"/></g><g id="i0-ex0"><rect x="60" y="175" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="195" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">EX0 = 0: ignora los rebotes</text></g><g id="flecha-03"><path d="M200 207V231" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,224.25 200,231.75 196.25,224.25" fill="#8A8A8A" stroke="none"/></g><g id="i0-reb"><rect x="60" y="232" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="252" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">CONT_REBOTE = 5 (50 ms)</text></g><g id="flecha-04"><path d="M200 264V288" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,281.25 200,288.75 196.25,281.25" fill="#8A8A8A" stroke="none"/></g><g id="i0-reti"><rect x="160" y="289" width="80" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="308" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RETI</text></g><g id="t0-start"><rect x="455" y="63" width="210" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ISR_T0 (vector 000BH)</text></g><g id="flecha-05"><path d="M560 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,110.25 560,117.75 556.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="t0-load"><rect x="420" y="118" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="138" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">TH0 = B1H, TL0 = E0H: recarga 10 ms</text></g><g id="flecha-06"><path d="M560 150V174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,167.25 560,174.75 556.25,167.25" fill="#8A8A8A" stroke="none"/></g><g id="t0-flag"><rect x="420" y="175" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="195" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">F_10MS = 1</text></g><g id="flecha-07"><path d="M560 207V231" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,224.25 560,231.75 556.25,224.25" fill="#8A8A8A" stroke="none"/></g><g id="t0-reti"><rect x="520" y="232" width="80" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="251" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RETI</text></g><text x="380" y="350" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">IE0 y TF0 los borra el hardware al saltar al vector.</text><text x="380" y="366" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">Ninguna toca A ni PSW, así que no hacen falta PUSH ni POP.</text></g></svg>
