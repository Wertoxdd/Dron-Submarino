<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" font-size="12.5" version="1.1" width="760px" height="700px"><title>MEDIR convierte los dos canales seguidos y MOSTRAR traduce con TABLA_7SEG</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">MEDIR convierte los dos canales seguidos y MOSTRAR traduce con TABLA_7SEG</text><g><g id="md-start"><rect x="140" y="63" width="120" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MEDIR</text></g><g id="flecha-01"><path d="M200 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,110.25 200,117.75 196.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="md-c0"><rect x="50" y="118" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="138" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ADCON = 08H: canal 0 y ADCS = 1</text></g><g id="flecha-02"><path d="M200 150V173" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,166.25 200,173.75 196.25,166.25" fill="#8A8A8A" stroke="none"/></g><g id="md-w0"><polygon points="125,202 200,174 275,202 200,230" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="206" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ADCI = 1?</text></g><g id="flecha-03"><path d="M125 202H70V162H197" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="190.25,158.25 197.75,162 190.25,165.75" fill="#8A8A8A" stroke="none"/></g><text x="98" y="194" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">no</text><text x="208" y="246" text-anchor="start" font-size="11.5" fill="#5C5C5C" font-family="Arial">sí</text><g id="flecha-04"><path d="M200 230V254" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,247.25 200,254.75 196.25,247.25" fill="#8A8A8A" stroke="none"/></g><g id="md-prof"><rect x="50" y="255" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="275" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PROF = ADCH</text></g><g id="flecha-05"><path d="M200 287V311" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,304.25 200,311.75 196.25,304.25" fill="#8A8A8A" stroke="none"/></g><g id="md-clr0"><rect x="50" y="312" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="332" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ADCI = 0 (ANL ADCON,#0EFH)</text></g><g id="flecha-06"><path d="M200 344V368" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,361.25 200,368.75 196.25,361.25" fill="#8A8A8A" stroke="none"/></g><g id="md-c1"><rect x="50" y="369" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="389" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ADCON = 09H: canal 1 y ADCS = 1</text></g><g id="flecha-07"><path d="M200 401V424" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,417.25 200,424.75 196.25,417.25" fill="#8A8A8A" stroke="none"/></g><g id="md-w1"><polygon points="125,453 200,425 275,453 200,481" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="457" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ADCI = 1?</text></g><g id="flecha-08"><path d="M125 453H70V413H197" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="190.25,409.25 197.75,413 190.25,416.75" fill="#8A8A8A" stroke="none"/></g><text x="98" y="445" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">no</text><text x="208" y="497" text-anchor="start" font-size="11.5" fill="#5C5C5C" font-family="Arial">sí</text><g id="flecha-09"><path d="M200 481V505" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,498.25 200,505.75 196.25,498.25" fill="#8A8A8A" stroke="none"/></g><g id="md-dist"><rect x="50" y="506" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="526" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">DIST = ADCH</text></g><g id="flecha-10"><path d="M200 538V562" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,555.25 200,562.75 196.25,555.25" fill="#8A8A8A" stroke="none"/></g><g id="md-clr1"><rect x="50" y="563" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="583" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ADCI = 0</text></g><g id="flecha-11"><path d="M200 595V619" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,612.25 200,619.75 196.25,612.25" fill="#8A8A8A" stroke="none"/></g><g id="md-ret"><rect x="164" y="620" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="639" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><text x="200" y="676" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">cada espera dura unos 25 µs (50 ciclos máquina)</text><g id="ms-start"><rect x="475" y="63" width="200" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MOSTRAR (A, B, C)</text></g><g id="flecha-12"><path d="M575 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,110.25 575,117.75 571.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="ms-dptr"><rect x="425" y="118" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="138" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">DPTR = TABLA_7SEG</text></g><g id="flecha-13"><path d="M575 150V174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,167.25 575,174.75 571.25,167.25" fill="#8A8A8A" stroke="none"/></g><g id="ms-p2"><rect x="425" y="175" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="195" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P2 = código de A (MOVC A,@A+DPTR)</text></g><g id="flecha-14"><path d="M575 207V231" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,224.25 575,231.75 571.25,224.25" fill="#8A8A8A" stroke="none"/></g><g id="ms-p0"><rect x="425" y="232" width="300" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="252" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P0 = código de B</text></g><g id="flecha-15"><path d="M575 264V287" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,280.25 575,287.75 571.25,280.25" fill="#8A8A8A" stroke="none"/></g><g id="ms-dp"><polygon points="500,316 575,288 650,316 575,344" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="320" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">C = 1?</text></g><g id="flecha-16"><path d="M575 344V368" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,361.25 575,368.75 571.25,361.25" fill="#8A8A8A" stroke="none"/></g><text x="583" y="360" text-anchor="start" font-size="11.5" fill="#5C5C5C" font-family="Arial">sí</text><g id="ms-on"><rect x="475" y="369" width="200" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="389" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P2.7 = P0.7 = 1 (dp)</text></g><g id="flecha-17"><path d="M575 401V445" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="578.75,438.25 575,445.75 571.25,438.25" fill="#8A8A8A" stroke="none"/></g><g id="flecha-18"><path d="M650 316H705V425H579" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="585.75,428.75 578.25,425 585.75,421.25" fill="#8A8A8A" stroke="none"/></g><text x="677" y="308" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">no</text><g id="ms-ret"><rect x="539" y="446" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="575" y="465" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><text x="575" y="506" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">A = letra: 0AH, 0CH, 0DH, 0EH o 0FH</text><text x="575" y="522" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">B = número de 0 a F · C = 1 si lleva dp</text><text x="575" y="538" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">TABLA_7SEG: 16 códigos, de 0 a F</text></g></svg>
