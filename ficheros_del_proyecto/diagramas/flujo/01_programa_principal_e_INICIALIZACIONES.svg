<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-size="12.5" version="1.1" width="760px" height="660px"><title>Tras el reset se inicializa una vez y el lazo CONTROL se repite sin fin</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">Tras el reset se inicializa una vez y el lazo CONTROL se repite sin fin</text><g><text x="170" y="62" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">Programa principal</text><g id="inicio"><rect x="110" y="77" width="120" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="96" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">INICIO</text></g><g id="flecha-01"><path d="M170 107V128" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,121.25 170,128.75 166.25,121.25" fill="#8A8A8A" stroke="none"/></g><g id="call-ini"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="65" y="129" width="210" height="34" rx="3"/><path d="M73 129V163M267 129V163"/></g><text x="170" y="150" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">INICIALIZACIONES</text></g><g id="flecha-02"><path d="M170 163V210" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,203.25 170,210.75 166.25,203.25" fill="#8A8A8A" stroke="none"/></g><g id="call-gen"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="65" y="211" width="210" height="34" rx="3"/><path d="M73 211V245M267 211V245"/></g><text x="170" y="232" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">GEN_COD_EVENT</text></g><g id="flecha-03"><path d="M170 245V282" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,275.25 170,282.75 166.25,275.25" fill="#8A8A8A" stroke="none"/></g><g id="call-maq"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="65" y="283" width="210" height="34" rx="3"/><path d="M73 283V317M267 283V317"/></g><text x="170" y="304" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">MAQ_ESTADOS</text></g><g id="lazo"><g id="flecha-04"><path d="M170 317V341H44V186H168" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="161.25,182.25 168.75,186 161.25,189.75" fill="#8A8A8A" stroke="none"/></g><text x="52" y="179" text-anchor="start" font-size="11.5" fill="#5C5C5C" font-family="Arial">CONTROL</text></g><text x="170" y="378" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">GEN_COD_EVENT deja un código (0–4)</text><text x="170" y="394" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">en EVENTO y MAQ_ESTADOS lo atiende</text><text x="170" y="410" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">según ESTADO. El lazo nunca espera.</text><text x="540" y="62" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">Subrutina INICIALIZACIONES</text><g id="i-start"><rect x="440" y="77" width="200" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="96" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">INICIALIZACIONES</text></g><g id="flecha-05"><path d="M540 107V129" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,122.25 540,129.75 536.25,122.25" fill="#8A8A8A" stroke="none"/></g><g id="i-sp"><rect x="380" y="130" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="150" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">SP = 7FH: la pila crece desde 80H</text></g><g id="flecha-06"><path d="M540 162V185" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,178.25 540,185.75 536.25,178.25" fill="#8A8A8A" stroke="none"/></g><g id="i-var"><rect x="380" y="186" width="320" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="205" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ESTADO = 0 · CONT_TICKS = 100</text><text x="540" y="221" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">EVENTO, CONT_REBOTE y flags a 0</text></g><g id="flecha-07"><path d="M540 232V255" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,248.25 540,255.75 536.25,248.25" fill="#8A8A8A" stroke="none"/></g><g id="i-pwmp"><rect x="380" y="256" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="276" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWMP = 5DH: PWM a 500 Hz</text></g><g id="flecha-08"><path d="M540 288V311" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,304.25 540,311.75 536.25,304.25" fill="#8A8A8A" stroke="none"/></g><g id="i-leds"><rect x="380" y="312" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="332" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P4.0 = P4.1 = 0: LEDs apagados</text></g><g id="flecha-09"><path d="M540 344V367" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,360.25 540,367.75 536.25,360.25" fill="#8A8A8A" stroke="none"/></g><g id="i-parar"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="380" y="368" width="320" height="32" rx="3"/><path d="M388 368V400M692 368V400"/></g><text x="540" y="388" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PARAR (ACC_3): motores parados, “– –”</text></g><g id="flecha-10"><path d="M540 400V423" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,416.25 540,423.75 536.25,416.25" fill="#8A8A8A" stroke="none"/></g><g id="i-t0"><rect x="380" y="424" width="320" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="443" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">T0 en modo 1: TMOD = 01H</text><text x="540" y="459" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">TH0 = B1H, TL0 = E0H (10 ms), TR0 = 1</text></g><g id="flecha-11"><path d="M540 470V493" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,486.25 540,493.75 536.25,486.25" fill="#8A8A8A" stroke="none"/></g><g id="i-int"><rect x="380" y="494" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="514" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">IT0 = 1 (flanco), EX0 = 1, ET0 = 1</text></g><g id="flecha-12"><path d="M540 526V549" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,542.25 540,549.75 536.25,542.25" fill="#8A8A8A" stroke="none"/></g><g id="i-ea"><rect x="380" y="550" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="570" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">EA = 1, la última</text></g><g id="flecha-13"><path d="M540 582V605" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="543.75,598.25 540,605.75 536.25,598.25" fill="#8A8A8A" stroke="none"/></g><g id="i-ret"><rect x="490" y="606" width="100" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="540" y="625" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g></g></svg>
