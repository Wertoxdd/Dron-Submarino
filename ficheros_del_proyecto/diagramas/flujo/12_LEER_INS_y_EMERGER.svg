<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-size="12.5" version="1.1" width="760px" height="470px"><title>LEER_INS consume la instrucción y EMERGER prepara la subida a 0 m</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">LEER_INS consume la instrucción y EMERGER prepara la subida a 0 m</text><g><g id="l-start"><rect x="100" y="63" width="140" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">LEER_INS</text></g><g id="flecha-01"><path d="M170 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,110.25 170,117.75 166.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="l-fin"><polygon points="80,146 170,118 260,146 170,174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="150" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PUNTERO &gt; 7FH?</text></g><g id="flecha-02"><path d="M260 146H289" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="282.25,142.25 289.75,146 282.25,149.75" fill="#8A8A8A" stroke="none"/></g><text x="274" y="136" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">sí</text><g id="l-f"><rect x="290" y="123" width="120" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="350" y="142" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">A = 0FH (F)</text><text x="350" y="158" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">B = 0</text></g><g id="flecha-03"><path d="M350 169V430H207" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="213.75,433.75 206.25,430 213.75,426.25" fill="#8A8A8A" stroke="none"/></g><text x="162" y="190" text-anchor="end" font-size="11.5" fill="#5C5C5C" font-family="Arial">no</text><g id="flecha-04"><path d="M170 174V198" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,191.25 170,198.75 166.25,191.25" fill="#8A8A8A" stroke="none"/></g><g id="l-byte"><rect x="40" y="199" width="260" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="219" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">A = byte en PUNTERO</text></g><g id="flecha-05"><path d="M170 231V255" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,248.25 170,255.75 166.25,248.25" fill="#8A8A8A" stroke="none"/></g><g id="l-split"><rect x="40" y="256" width="260" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="275" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">A = INS (nibble alto)</text><text x="170" y="291" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">B = n o t (nibble bajo)</text></g><g id="flecha-06"><path d="M170 302V326" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,319.25 170,326.75 166.25,319.25" fill="#8A8A8A" stroke="none"/></g><g id="l-inc"><rect x="40" y="327" width="260" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="347" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PUNTERO = PUNTERO + 1</text></g><g id="flecha-07"><path d="M170 359V414" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="173.75,407.25 170,414.75 166.25,407.25" fill="#8A8A8A" stroke="none"/></g><g id="l-ret"><rect x="134" y="415" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="170" y="434" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><g id="e-start"><rect x="520" y="63" width="140" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="82" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">EMERGER</text></g><g id="flecha-08"><path d="M590 93V117" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="593.75,110.25 590,117.75 586.25,110.25" fill="#8A8A8A" stroke="none"/></g><g id="e-obj"><rect x="450" y="118" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="138" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">OBJETIVO = 67 (superficie, 0 m)</text></g><g id="flecha-09"><path d="M590 150V174" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="593.75,167.25 590,174.75 586.25,167.25" fill="#8A8A8A" stroke="none"/></g><g id="e-sent"><rect x="450" y="175" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="195" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">SENTIDO = 1 (subir), FIN = 1</text></g><g id="flecha-10"><path d="M590 207V231" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="593.75,224.25 590,231.75 586.25,224.25" fill="#8A8A8A" stroke="none"/></g><g id="e-pwm0"><rect x="450" y="232" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="252" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM0 = B3H (70 %), P1.5 = 1</text></g><g id="flecha-11"><path d="M590 264V288" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="593.75,281.25 590,288.75 586.25,281.25" fill="#8A8A8A" stroke="none"/></g><g id="e-pwm1"><rect x="450" y="289" width="280" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="309" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM1 = 00H, P1.7–P1.6 = 00</text></g><g id="flecha-12"><path d="M590 321V345" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="593.75,338.25 590,345.75 586.25,338.25" fill="#8A8A8A" stroke="none"/></g><g id="e-disp"><rect x="450" y="346" width="280" height="46" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="365" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P2 = F1H: “F” con dp</text><text x="590" y="381" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P0 = 80H: solo el dp</text></g><g id="flecha-13"><path d="M590 392V414" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="593.75,407.25 590,414.75 586.25,407.25" fill="#8A8A8A" stroke="none"/></g><g id="e-ret"><rect x="554" y="415" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="590" y="434" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g></g></svg>
