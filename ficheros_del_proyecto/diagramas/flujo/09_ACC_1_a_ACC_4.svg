<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 680" font-size="12.5" version="1.1" width="760px" height="680px"><title>ACC_1 a ACC_4: cada acción fija sus salidas y vuelve sin esperar</title><text x="24" y="30" font-size="15" font-weight="bold" fill="#1A1A1A" text-anchor="start" font-family="Arial">ACC_1 a ACC_4: cada acción fija sus salidas y vuelve sin esperar</text><g><g id="a1-start"><rect x="105" y="61" width="190" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="80" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ACC_1 DORMIR</text></g><g id="flecha-01"><path d="M200 91V114" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,107.25 200,114.75 196.25,107.25" fill="#8A8A8A" stroke="none"/></g><g id="a1-idle"><rect x="40" y="115" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="135" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ORL PCON,#01H: CPU en idle</text></g><g id="flecha-02"><path d="M200 147V171" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,164.25 200,171.75 196.25,164.25" fill="#8A8A8A" stroke="none"/></g><g id="a1-ret"><rect x="164" y="172" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="191" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><text x="200" y="222" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">La despiertan INT0 o el tick de T0;</text><text x="200" y="238" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">tras la ISR sigue por el RET</text><g id="a3-start"><rect x="120" y="275" width="160" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="294" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ACC_3 PARAR</text></g><g id="flecha-03"><path d="M200 305V328" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,321.25 200,328.75 196.25,321.25" fill="#8A8A8A" stroke="none"/></g><g id="a3-pwm"><rect x="40" y="329" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="349" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWM0 = PWM1 = 00H (0 %)</text></g><g id="flecha-04"><path d="M200 361V384" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,377.25 200,384.75 196.25,377.25" fill="#8A8A8A" stroke="none"/></g><g id="a3-p1"><rect x="40" y="385" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="405" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P1.7–P1.6 = 00</text></g><g id="flecha-05"><path d="M200 417V440" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,433.25 200,440.75 196.25,433.25" fill="#8A8A8A" stroke="none"/></g><g id="a3-disp"><rect x="40" y="441" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="461" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">P2 = P0 = 40H: “– –” sin dp</text></g><g id="flecha-06"><path d="M200 473V497" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="203.75,490.25 200,497.75 196.25,490.25" fill="#8A8A8A" stroke="none"/></g><g id="a3-ret"><rect x="164" y="498" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="200" y="517" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><text x="200" y="548" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">No toca los LEDs: siguen diciendo</text><text x="200" y="564" font-size="11.5" fill="#5C5C5C" text-anchor="middle" font-family="Arial">por qué terminó el recorrido</text><g id="a2-start"><rect x="470" y="61" width="180" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="80" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ACC_2 INICIAR</text></g><g id="flecha-07"><path d="M560 91V114" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,107.25 560,114.75 556.25,107.25" fill="#8A8A8A" stroke="none"/></g><g id="a2-leds"><rect x="400" y="115" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="135" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">LED_FIN = LED_OBST = 0</text></g><g id="flecha-08"><path d="M560 147V170" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,163.25 560,170.75 556.25,163.25" fill="#8A8A8A" stroke="none"/></g><g id="a2-pwmp"><rect x="400" y="171" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="191" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PWMP = 5DH (el idle reinicia el PWM)</text></g><g id="flecha-09"><path d="M560 203V226" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,219.25 560,226.75 556.25,219.25" fill="#8A8A8A" stroke="none"/></g><g id="a2-ptr"><rect x="400" y="227" width="320" height="32" rx="3" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="247" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PUNTERO = 50H</text></g><g id="flecha-10"><path d="M560 259V282" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,275.25 560,282.75 556.25,275.25" fill="#8A8A8A" stroke="none"/></g><g id="a2-leer"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="400" y="283" width="320" height="32" rx="3"/><path d="M408 283V315M712 283V315"/></g><text x="560" y="303" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">LEER_INS: A = C, B = n</text></g><g id="flecha-11"><path d="M560 315V338" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,331.25 560,338.75 556.25,331.25" fill="#8A8A8A" stroke="none"/></g><g id="a2-prep"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="400" y="339" width="320" height="32" rx="3"/><path d="M408 339V371M712 339V371"/></g><text x="560" y="359" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PREP_VERTICAL</text></g><g id="flecha-12"><path d="M560 371V395" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,388.25 560,395.75 556.25,388.25" fill="#8A8A8A" stroke="none"/></g><g id="a2-ret"><rect x="524" y="396" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="415" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g><g id="a4-start"><rect x="455" y="461" width="210" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="480" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">ACC_4 INS_VERTICAL</text></g><g id="flecha-13"><path d="M560 491V514" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,507.25 560,514.75 556.25,507.25" fill="#8A8A8A" stroke="none"/></g><g id="a4-leer"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="400" y="515" width="320" height="32" rx="3"/><path d="M408 515V547M712 515V547"/></g><text x="560" y="535" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">LEER_INS: A = C, B = n</text></g><g id="flecha-14"><path d="M560 547V570" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,563.25 560,570.75 556.25,563.25" fill="#8A8A8A" stroke="none"/></g><g id="a4-prep"><g fill="none" stroke="#8A8A8A" stroke-width="1.25"><rect x="400" y="571" width="320" height="32" rx="3"/><path d="M408 571V603M712 571V603"/></g><text x="560" y="591" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">PREP_VERTICAL</text></g><g id="flecha-15"><path d="M560 603V627" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><polygon points="563.75,620.25 560,627.75 556.25,620.25" fill="#8A8A8A" stroke="none"/></g><g id="a4-ret"><rect x="524" y="628" width="72" height="30" rx="15" fill="none" stroke="#8A8A8A" stroke-width="1.25"/><text x="560" y="647" font-weight="bold" fill="#1A1A1A" text-anchor="middle" font-size="12.5" font-family="Arial">RET</text></g></g></svg>
